[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-task-relay"
version = "0.2.0"
description = "Bridge any AI chat to any coding agent via Git."
readme = "README.md"
authors = [
    { name = "Ege Çağın Tepe", email = "egecagintepe@gmail.com" }
]
license = { text = "PolyForm Internal Use License 1.0.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = [
    "agent-skills",
    "coding-agents",
    "ai-agents",
    "automation",
    "github",
    "python",
    "claude-code",
    "codex",
    "gemini-cli",
    "opencode",
    "multi-agent"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
agent-task-relay = "agent_task_relay.cli:main"
atr = "agent_task_relay.cli:main"

[project.urls]
Homepage = "https://github.com/egecagintepe/agent-task-relay"
Documentation = "https://github.com/egecagintepe/agent-task-relay#readme"
Repository = "https://github.com/egecagintepe/agent-task-relay"
Issues = "https://github.com/egecagintepe/agent-task-relay/issues"
Changelog = "https://github.com/egecagintepe/agent-task-relay/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_task_relay" = ["packaged_skill/**/*", "packaged_skill/*"]

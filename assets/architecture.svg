<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%" style="background:#0d1117;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Tagline -->
  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">AGENT TASK RELAY WORKFLOW</text>
  <text x="480" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">Your AI chat plans. Your coding agent builds. Git carries the handoff.</text>

  <!-- Node 1: AI Chat Assistant -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="240" height="150" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="70" cy="130" r="14" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="70" y="135" text-anchor="middle" fill="#38bdf8" font-size="14">💬</text>
    <text x="95" y="135" fill="#f8fafc" font-size="15" font-weight="600">AI Chat Assistant</text>
    <text x="60" y="165" fill="#94a3b8" font-size="12">• ChatGPT / Claude / Gemini</text>
    <text x="60" y="185" fill="#94a3b8" font-size="12">• High-level task planning</text>
    <text x="60" y="205" fill="#94a3b8" font-size="12">• Writes inbox/TASK-*.md</text>
    <text x="60" y="225" fill="#38bdf8" font-size="11" font-weight="500">No chat API key required</text>
  </g>

  <!-- Arrow 1: Chat -> Bridge -->
  <path d="M 280 175 L 340 175" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="310" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">GitHub Push</text>

  <!-- Node 2: Private Git Bridge -->
  <g filter="url(#shadow)">
    <rect x="360" y="90" width="240" height="170" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="390" cy="120" r="14" fill="#10b981" fill-opacity="0.2"/>
    <text x="390" y="125" text-anchor="middle" fill="#10b981" font-size="14">🔒</text>
    <text x="415" y="125" fill="#f8fafc" font-size="15" font-weight="600">Private Git Bridge</text>
    <text x="380" y="155" fill="#94a3b8" font-size="12">📁 inbox/ (Task packet)</text>
    <text x="380" y="175" fill="#94a3b8" font-size="12">📁 state/ (SHA-256 claims)</text>
    <text x="380" y="195" fill="#94a3b8" font-size="12">📁 outbox/ (Result reports)</text>
    <text x="380" y="220" fill="#10b981" font-size="11" font-weight="500">Durable • Asynchronous • Safe</text>
    <text x="380" y="240" fill="#64748b" font-size="10">Isolated from user project code</text>
  </g>

  <!-- Arrow 2: Bridge -> Local Runner -->
  <path d="M 600 175 L 660 175" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>
  <text x="630" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">Poll 60s</text>

  <!-- Node 3: Local Coding Agent -->
  <g filter="url(#shadow)">
    <rect x="680" y="100" width="240" height="150" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="710" cy="130" r="14" fill="#818cf8" fill-opacity="0.2"/>
    <text x="710" y="135" text-anchor="middle" fill="#818cf8" font-size="14">⚡</text>
    <text x="735" y="135" fill="#f8fafc" font-size="15" font-weight="600">Coding Agent Runner</text>
    <text x="700" y="165" fill="#94a3b8" font-size="12">• Antigravity / Claude Code / etc.</text>
    <text x="700" y="185" fill="#94a3b8" font-size="12">• Edits code in workspace</text>
    <text x="700" y="205" fill="#94a3b8" font-size="12">• Executes local tests</text>
    <text x="700" y="225" fill="#818cf8" font-size="11" font-weight="500">Publishes outbox report</text>
  </g>

  <!-- Return Flow -->
  <path d="M 680 230 C 580 290, 420 290, 260 230" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3"/>
  <text x="480" y="295" text-anchor="middle" fill="#64748b" font-size="11">Result report reviewed by chat assistant or developer</text>
</svg>

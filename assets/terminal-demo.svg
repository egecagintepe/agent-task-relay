<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <filter id="termShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Window Container -->
  <rect x="10" y="10" width="900" height="460" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" filter="url(#termShadow)"/>

  <!-- Title bar -->
  <path d="M 10 10 L 910 10 A 10 10 0 0 1 910 44 L 10 44 A 10 10 0 0 1 10 10 Z" fill="#161b22"/>
  <circle cx="32" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="27" r="6" fill="#27c93f"/>
  <text x="460" y="31" text-anchor="middle" fill="#8b949e" font-family="-apple-system,Consolas,monospace" font-size="12" font-weight="600">agent-task-relay — mock handshake</text>

  <!-- Terminal Content -->
  <g font-family="Consolas, 'Cascadia Code', 'Fira Code', monospace" font-size="13" xml:space="preserve">
    <!-- Line 1 -->
    <text x="30" y="80" fill="#7ee787">$</text>
    <text x="48" y="80" fill="#c9d1d9">agent-task-relay doctor</text>

    <!-- Output 1 -->
    <text x="30" y="105" fill="#58a6ff">=== Agent Task Relay Doctor ===</text>
    <text x="30" y="125" fill="#8b949e">Version:      0.2.0 | Python: 3.12.10 | Platform: win32</text>
    <text x="30" y="145" fill="#8b949e">Git CLI:      OK (git version 2.55.0)</text>
    <text x="30" y="165" fill="#8b949e">Bridge repo:  OK (C:/Dev/my-agent-bridge) - Remote detected</text>
    <text x="30" y="185" fill="#8b949e">Workspace:    OK (C:/Dev/my-project)</text>
    <text x="30" y="205" fill="#3fb950">Runner:       mock [verified] -&gt; AVAILABLE (Mock runner ready)</text>
    <text x="30" y="225" fill="#8b949e">Approval:     manual (content-bound SHA-256)</text>

    <!-- Line 2 -->
    <text x="30" y="260" fill="#7ee787">$</text>
    <text x="48" y="260" fill="#c9d1d9">agent-task-relay ping</text>
    <text x="30" y="285" fill="#8b949e">Ping task queued and locally approved: </text>
    <text x="360" y="285" fill="#79c0ff">TASK-ping-202611070020-ab12cd</text>
    <text x="30" y="305" fill="#8b949e">Run `agent-task-relay once` to process the handshake.</text>

    <!-- Line 3 -->
    <text x="30" y="340" fill="#7ee787">$</text>
    <text x="48" y="340" fill="#c9d1d9">agent-task-relay once</text>
    <text x="30" y="365" fill="#79c0ff">[INFO] Claimed TASK-ping-202611070020-ab12cd. Dispatching to runner: mock ...</text>
    <text x="30" y="385" fill="#3fb950">[INFO] Published result for TASK-ping-202611070020-ab12cd: completed (0.05s)</text>

    <!-- Line 4 -->
    <text x="30" y="420" fill="#7ee787">$</text>
    <text x="48" y="420" fill="#c9d1d9">git log -1 --oneline</text>
    <text x="30" y="445" fill="#e3b341">7a3f12c</text>
    <text x="95" y="445" fill="#8b949e">result: TASK-ping-202611070020-ab12cd (completed)</text>
  </g>
</svg>
